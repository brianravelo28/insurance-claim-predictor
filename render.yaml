# Render Blueprint: New + -> Blueprint -> pick this repo.
services:
  - type: web
    name: florida-flood-claim-severity
    runtime: python
    plan: starter  # upgraded from free in the Render dashboard; keeps the service awake (no cold starts). RAM is 512 MB on both.
    buildCommand: pip install -r requirements-render.txt
    startCommand: gunicorn wsgi:application --workers 1 --threads 4 --timeout 120 --bind 0.0.0.0:$PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: OMP_NUM_THREADS
        value: "1"
      - key: MALLOC_ARENA_MAX
        value: "2"
